<style id="bcp-style">html{scrollbar-gutter:stable}#bcp-overlay{display:none;position:fixed;inset:0;z-index:99999;background:rgba(6,28,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;box-sizing:border-box;contain:layout paint;opacity:0;pointer-events:none;transition:opacity .35s ease}#bcp-overlay.bcp-visible{display:flex}#bcp-overlay.bcp-in{opacity:1;pointer-events:auto}#bcp-overlay.bcp-out{opacity:0}#bcp-card{position:relative;width:100%;max-width:400px;padding:36px 28px 28px;border-radius:24px;box-sizing:border-box;overflow:hidden;text-align:center;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(150deg,#0a3d26 0%,#0f5035 55%,#082e1d 100%);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07) inset,0 1px 0 rgba(255,255,255,.12) inset;transform:translateY(28px) scale(.97);transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .42s ease;opacity:0}#bcp-overlay.bcp-in #bcp-card{transform:translateY(0) scale(1);opacity:1}#bcp-card::before,#bcp-card::after{content:'';position:absolute;border-radius:50%;background:rgba(198,124,42,.16);pointer-events:none}#bcp-card::before{width:180px;height:180px;top:-60px;right:-50px}#bcp-card::after{width:140px;height:140px;bottom:-50px;left:-40px}#bcp-close{position:absolute;top:14px;right:16px;width:30px;height:30px;min-width:30px;min-height:30px;padding:0;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:16px;line-height:1;transition:background .2s,color .2s;z-index:2}#bcp-close:hover{background:rgba(255,255,255,.16);color:#fff}#bcp-close:focus-visible,.bcp-btn:focus-visible{outline:2px solid #7fd4a3;outline-offset:2px}#bcp-main,#bcp-success{position:relative;z-index:1}.bcp-icon-wrap{width:56px;height:56px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;box-shadow:0 0 20px rgba(255,215,0,.15)}.bcp-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:5px 13px;border-radius:20px;margin-bottom:14px}.bcp-badge span{color:#fff;font-size:10px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase}.bcp-title{color:#fff;font-size:30px;font-weight:700;margin:0 0 10px;line-height:1.15;letter-spacing:-.3px}.bcp-body{color:#a8c8b8;font-size:14.5px;line-height:1.6;margin:0 0 22px;padding:0 6px}.bcp-body strong{color:#e0f0e8;font-weight:700}.bcp-input{width:100%;padding:14px 16px;border:1.5px solid rgba(255,255,255,.1);border-radius:12px;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:16px;color:#1a3a28;background:#eef4f0;margin-bottom:12px;box-sizing:border-box;outline:none;transition:border-color .2s,box-shadow .2s}.bcp-input:focus{border-color:rgba(100,200,140,.6);box-shadow:0 0 0 3px rgba(100,200,140,.15)}.bcp-input::placeholder{color:#7a9e8c}.bcp-btn{width:100%;padding:15px;background:linear-gradient(135deg,#2e8b57 0%,#1a6b3f 100%);border:none;border-radius:12px;color:#fff;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:.4px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.1) inset;transition:transform .15s,box-shadow .15s,opacity .2s}.bcp-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.35)}.bcp-btn:active:not(:disabled){transform:translateY(0)}.bcp-btn:disabled{opacity:.65;cursor:not-allowed}.bcp-disclaimer{color:#6a9a84;font-size:11.5px;margin-top:14px}#bcp-msg{display:none;margin:12px 0 0;padding:11px 14px;border-radius:10px;font-size:13px;line-height:1.5;text-align:left}#bcp-msg.bcp-msg-warn{background:rgba(255,200,50,.1);border:1px solid rgba(255,200,50, <div id="bcp-overlay" role="dialog" aria-modal="true" aria-labelledby="bcp-title"><div id="bcp-card"><button id="bcp-close" aria-label="Close popup">&#x2715;</button><div id="bcp-main"><div class="bcp-icon-wrap">🍂</div><div class="bcp-badge"><span>✨</span><span>Limited Time Offer</span></div><h2 class="bcp-title" id="bcp-title">Autumn Sale Offers</h2><p class="bcp-body">Subscribe now and unlock an exclusive <strong>10% OFF on Botox Treatment</strong> coupon delivered straight to your inbox.</p><input type="email" id="bcp-email" class="bcp-input" placeholder="Enter your email address" autocomplete="email" inputmode="email" required><button id="bcp-btn" class="bcp-btn">GET MY 10% OFF COUPON</button><div id="bcp-msg" role="status" aria-live="polite"></div><p class="bcp-disclaimer">No spam, ever. Unsubscribe anytime.</p></div><div id="bcp-success"><div class="bcp-success-icon">🎉</div><h2 class="bcp-success-title">Success!</h2><p class="bcp-success-body">Your coupon has been sent.<br>Check your inbox for <strong>BOTOX10</strong>.</p></div></div></div>
<script>(function(){'use strict';

   It never opens while the visitor is typing in a form (it waits and tries again),
   and never on a page Chrome is building in the background for instant navigation. */
var SHOW_AFTER_MS=30000,SCROLL_RATIO=0.5,EXIT_INTENT=true,
TIMEOUT_MS=15000,REMEMBER_DAYS=30,ENDPOINT='https://script.google.com/macros/s/AKfycbweIboe7gnBSs6xQk3ub2mRf9VK5btyH0q1vLK5QnKRNvEoDe71O1ZoBsWkKRVsPMBG0w/exec',STORAGE_KEY='bcp_shown_autumn26',EMAIL_RE=/^[^\s@,;:<>()\[\]\\"]+@[^\s@.]+(\.[^\s@.]+)+$/,overlay,card,closeBtn,emailInput,submitBtn,mainDiv,successDiv,msgEl,btnLabel,lastFocus;function seen(){try{var v=localStorage.getItem(STORAGE_KEY);if(!v)return false;if(v==='1')return true;return REMEMBER_DAYS===0||Date.now()<Number(v)}catch(_){return false}}function remember(){try{localStorage.setItem(STORAGE_KEY,REMEMBER_DAYS===0?'1':String(Date.now()+REMEMBER_DAYS*864e5))}catch(_){}}function validEmail(s){if(!s||s.length>254||!EMAIL_RE.test(s))return false;return /^[a-z]{2,24}$/i.test(s.split('@')[1].split('.').pop())}function setMsg(k,h){if(!k){msgEl.style.display='none';msgEl.className='';return}msgEl.className='bcp-msg-'+k;msgEl.innerHTML=h;msgEl.style.display='block'}function resetBtn(){submitBtn.textContent=btnLabel;submitBtn.disabled=false}function openPopup(){lastFocus=document.activeElement;remember();document.documentElement.style.overflow='hidden';overlay.classList.add('bcp-visible');requestAnimationFrame(function(){requestAnimationFrame(function(){overlay.classList.add('bcp-in');try{emailInput.focus({preventScroll:true})}catch(_){emailInput.focus()}})})}function closePopup(){document.documentElement.style.overflow='';overlay.classList.remove('bcp-in');overlay.classList.add('bcp-out');overlay.addEventListener('transitionend',function onClose(ev){if(ev.target!==overlay)return;overlay.classList.remove('bcp-visible','bcp-out');overlay.removeEventListener('transitionend',onClose)});if(lastFocus&&lastFocus.focus){try{lastFocus.focus()}catch(_){}}}function trapFocus(ev){if(ev.key!=='Tab'||!overlay.classList.contains('bcp-in'))return;var f=[].slice.call(card.querySelectorAll('button,input,a[href]')).filter(function(el){return !el.disabled&&el.offsetParent!==null});if(!f.length)return;var a=f[0],b=f[f.length-1];if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();b.focus()}else if(!ev.shiftKey&&document.activeElement===b){ev.preventDefault();a.focus()}}function handleSubmit(ev){if(ev)ev.preventDefault();if(submitBtn.disabled)return;var email=emailInput.value.trim().toLowerCase();if(!validEmail(email)){setMsg('err','Please enter a valid email address, for example name@example.com.');emailInput.focus();return}setMsg(null);submitBtn.textContent='Sending\u2026';submitBtn.disabled=true;var ctrl=('AbortController' in window)?new AbortController():null,timer=setTimeout(function(){if(ctrl)ctrl.abort()},TIMEOUT_MS);fetch(ENDPOINT,{method:'POST',body:JSON.stringify({email:email}),signal:ctrl?ctrl.signal:undefined}).then(function(r){return r.json()}).then(function(d){clearTimeout(timer);if(d.status==='success'){mainDiv.style.display='none';successDiv.style.display='block';remember()}else if(d.status==='already_used'){setMsg('warn','\u26a0\ufe0f Looks like you have <strong>already claimed</strong> this offer.');resetBtn()}else if(d.status==='invalid_email'){setMsg('err','That email address does not look valid. Please check it and try again.');resetBtn()}else{throw new Error(d.message||'')}}).catch(function(){clearTimeout(timer);setMsg('err','\u274c Could not send the coupon. Please try again in a moment.');resetBtn()})}function init(){if(seen())return;overlay=document.getElementById('bcp-overlay');if(!overlay)return;card=document.getElementById('bcp-card');closeBtn=document.getElementById('bcp-close');emailInput=document.getElementById('bcp-email');submitBtn=document.getElementById('bcp-btn');mainDiv=document.getElementById('bcp-main');successDiv=document.getElementById('bcp-success');msgEl=document.getElementById('bcp-msg');btnLabel=submitBtn.textContent;closeBtn.addEventListener('click',closePopup);overlay.addEventListener('click',function(e){if(e.target===overlay)closePopup()});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&overlay.classList.contains('bcp-in')){closePopup()}else{trapFocus(e)}});submitBtn.addEventListener('click',handleSubmit);emailInput.addEventListener('keydown',function(e){if(e.key==='Enter')handleSubmit(e)});emailInput.addEventListener('input',function(){setMsg(null)});openWhenFree()}
function typingInForm(){var el=document.activeElement;return !!(el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!(overlay&&overlay.contains(el)))}
function openWhenFree(){if(typingInForm()){setTimeout(openWhenFree,4000);return}openPopup()}
function arm(){if(seen())return;var fired=false,timer=null,fine=EXIT_INTENT&&window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;function fire(){if(fired)return;fired=true;clearTimeout(timer);window.removeEventListener('scroll',onScroll);document.removeEventListener('mouseout',onOut);if('requestIdleCallback' in window){requestIdleCallback(init,{timeout:1000})}else{setTimeout(init,200)}}function onScroll(){var h=document.documentElement,max=h.scrollHeight-window.innerHeight;if(max>0&&(window.scrollY||h.scrollTop)/max>=SCROLL_RATIO)fire()}function onOut(e){if(!e.relatedTarget&&e.clientY<=0)fire()}timer=setTimeout(fire,SHOW_AFTER_MS);window.addEventListener('scroll',onScroll,{passive:true});if(fine)document.addEventListener('mouseout',onOut)}
function start(){if(document.readyState==='complete'){arm()}else{window.addEventListener('load',arm,{once:true,passive:true})}}
if(document.prerendering){document.addEventListener('prerenderingchange',start,{once:true})}else{start()}})();</script>
