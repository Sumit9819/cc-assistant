<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Sora"; src: url("../fonts/Sora[wght].ttf"); font-weight: 100 800; }
  @font-face { font-family: "Manrope"; src: url("../fonts/Manrope[wght].ttf"); font-weight: 200 800; }
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  #scrim { position: absolute; inset: 0; background: rgba(8,9,12,.86); }
  /* Flex centring: nothing here depends on how long the title runs. */
  #wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 40px; }
  #kicker { display: flex; align-items: center; gap: 24px; font: 700 28px "Manrope";
            letter-spacing: 7px; color: #deab4e; white-space: nowrap; }
  #kicker .rule { width: 72px; height: 1px; background: rgba(222,171,78,.55); }
  #title { max-width: 1440px; text-align: center; font: 600 104px/1.06 "Sora"; letter-spacing: -0.025em;
           color: #f6f2eb; overflow-wrap: break-word; text-wrap: balance; }
  #base { width: 128px; height: 2px; background: #deab4e; transform-origin: center; }
</style>
<div id="scrim"></div>
<div id="wrap">
  <div id="kicker"><span class="rule"></span><span id="kicktext"></span><span class="rule"></span></div>
  <div id="title"></div>
  <div id="base"></div>
</div>
<script>
  let S = { title: "", kicker: "", duration: 4.0 };
  const $ = (id) => document.getElementById(id);
  const clamp = (t) => Math.min(Math.max(t, 0), 1);
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);

  window.setup = (spec) => {
    S = Object.assign(S, spec);
    $("title").textContent = S.title;
    $("kicktext").textContent = S.kicker;
    $("kicker").style.display = S.kicker ? "flex" : "none";
    window.seek(0);
  };

  window.seek = (t) => {
    // Everything shares one exit so the footage is revealed in one motion.
    const out = clamp((S.duration - t) / 0.8);
    $("scrim").style.opacity = 0.99 * Math.min(1, out);

    const k = easeOut((t - 0.1) / 0.6);
    $("kicker").style.opacity = Math.min(k, out);
    $("kicker").style.letterSpacing = (7 + (1 - k) * 14) + "px";

    const ti = easeOut((t - 0.35) / 0.9);
    $("title").style.opacity = Math.min(ti, out);
    $("title").style.transform = `translateY(${(1 - ti) * 42}px)`;

    const b = easeOut((t - 0.7) / 0.7);
    $("base").style.opacity = Math.min(b, out);
    $("base").style.transform = `scaleX(${b})`;
  };
</script>
